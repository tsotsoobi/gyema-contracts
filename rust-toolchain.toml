# Single source of truth for the Rust toolchain, honoured by rustup itself.
#
# `channel` MUST be a literal version. "stable" is a floating channel, not a
# pin: it silently changes under you and defeats the point of this file.
#
# `targets` and `components` live here, not in the CI workflow, so the two
# cannot drift apart. See .github/workflows/rust.yml.
[toolchain]
channel = "1.98.0"
targets = ["wasm32-unknown-unknown"]
components = ["clippy", "rustfmt"]
profile = "minimal"
